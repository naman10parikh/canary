name: canary RSI
# D18 (CP123 Wave B): ENABLED workflow_dispatch (+ a nightly schedule) running (a) the
# deterministic $0/tokenless RSI loop (workflows/rsi.workflow.js) AND (b) the dogfood cron
# check-in (canary's own HEARTBEAT — a missed run is itself an incident, S18 / OPINIONS D5).
# This is the dogfood: the observability employee that preaches "wire a dead-man's-switch on
# every scheduled job" wires one on ITS OWN scheduled job. ENABLED, not just written (the #1
# fleet-gap lesson — CP117 burned on "written != enabled").
#
# The Claude half stays dark (D8): it is gated behind CLAUDE_CODE_OAUTH_TOKEN inside
# rsi.workflow.js (absent -> no-op). The deterministic half runs at $0 here.
on:
  workflow_dispatch:
  schedule:
    # Nightly, 09:00 UTC (dsip.json loop.cadence) — re-verify the tool matrix + run the death-watch.
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  rsi:
    name: deterministic RSI loop + dogfood check-in
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install + build (the loop runs canary eval against dist/)
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: RSI deterministic loop (6 steps + death-watch, $0)
        run: |
          # Runs refresh-brain -> re-verify+death-watch -> run-eval-pyramid -> propose ->
          # test-gate -> commit (proposes; never auto-commits). Detects stale pins + dead/
          # archived tools. Exit non-zero only if a step fails (red-blocks the dispatch).
          node workflows/rsi.workflow.js --deterministic

      - name: Keep the proposal for review (the loop proposes; a person merges)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-proposal
          path: .rsi/
          if-no-files-found: ignore

      - name: Dogfood cron check-in (S18 dead-man's-switch — a missed run is an incident)
        run: |
          # canary's own HEARTBEAT: emit a check-in proving the scheduled loop actually ran.
          # The CLASS this guards (S18 / KNOWN-PITFALLS §1c): a cron that SILENTLY STOPS fires
          # no error, no log, no metric — only the ABSENCE of an expected event. So we emit a
          # positive check-in here; a real deployment wires this to a Sentry Cron / Better Stack
          # heartbeat URL (CANARY_HEARTBEAT_URL) that pages when this check-in is MISSED.
          node scripts/dogfood-checkin.mjs

      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('.rsi/proposal.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s .rsi/proposal.json ] || { echo "The proposal file is empty, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            echo '````json'
            cat .rsi/proposal.json
            echo '````'
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Canary: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
