<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">canary --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: canary [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">The early warning that's actually actionable — instrument once, page on</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">symptoms, prove the page delivers. Powered by Energy.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version                print the canary version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                   display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  instrument [options] &lt;dir&gt;   Wire OpenTelemetry into a service (thrown error →</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                               span exception event + error.type; latency →</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                               histogram). Local file exporter by default — $0,</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                               no creds.</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  slo [options]                Scaffold MWMBR SLO rules (14.4×/6×/1×),</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                               SLI-as-ratio, promtool-valid (S6).</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;dir&gt;        Run the version-specific footgun audit (source</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                               maps, tracesSampleRate, tunnel,</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                               autoSessionTracking, rate-without-floor, averaged</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                               percentiles, cardinality, send_resolved, EOL</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                               Prometheus, dead tools).</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  check-delivery [options]     Fire a synthetic page through each notification</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                               channel → prove it delivers; a dead channel is</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                               re-reported via a different one (the</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                               differentiator, S5).</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
